# Add on packages go here. The most common starting one is dbt_utils,
# which gives you ready made tests and helper macros so you write less
# repeated code.
#
# To turn it on: remove the # from the four lines below, then run
#   uv run --env-file .env dbt deps
# You can check the current version on the dbt package hub.

packages:
  - package: 'dbt-labs/dbt_utils'
    version: ['>=1.1.0', '<2.0.0']
