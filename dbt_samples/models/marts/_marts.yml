version: 2

models:
  - name: dim_customers
    description: 'One row per operator, the customer dimension.'
    columns:
      - name: customer_id
        description: 'Primary key of the customer dimension.'
        tests: [unique, not_null]

  - name: dim_products
    description: 'One row per product, enriched with its department.'
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: department
        description: 'Merchandising department from the seed lookup.'
        tests: [not_null]

  - name: fct_order_items
    description: 'The core fact table at one row per order line.'
    columns:
      - name: order_item_sk
        description: 'Surrogate key generated by dbt_utils.'
        tests: [unique, not_null]
      - name: customer_id
        description: 'Foreign key to the customer dimension.'
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: quantity
        description: 'Units on the line. Should always be at least one.'
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: line_revenue
        description: 'Line revenue after discount.'
        tests: [non_negative]

  - name: fct_orders
    description: 'Order level rollup, one row per order.'
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: order_revenue
        tests: [non_negative]

  - name: mart_category_daily_sales
    description: 'Revenue and margin by category and day.'

  - name: mart_customer_summary
    description: 'Lifetime totals per operator.'
    columns:
      - name: customer_id
        tests: [unique, not_null]
        
  - name: mart_monthly_category_sales
    columns:
      - name: margin_pct
        tests:
          - valid_percentage